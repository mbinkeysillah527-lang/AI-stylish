services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fashion
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: fashion
    ports: ['5432:5432']
    volumes: [fashion_postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  api:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file: ./backend/.env
    volumes: [./backend:/app]
    ports: ['8000:8000']
    depends_on: [postgres, redis]
  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: ./backend/.env
    volumes: [./backend:/app]
    depends_on: [api, redis]
volumes:
  fashion_postgres:
